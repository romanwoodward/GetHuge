info:
  app:
    name: '@info.app.name@'
    version: '@info.app.version@'
    grailsVersion: '@info.app.grailsVersion@'
grails:
  views:
    default:
      codec: html
    gsp:
      encoding: UTF-8
      htmlcodec: xml
      codecs:
        expression: html
        scriptlet: html
        taglib: none
        staticparts: none
  codegen:
    defaultPackage: com.example
  profile: web
  mime:
    disable:
      accept:
        header:
          userAgents:
          - Gecko
          - WebKit
          - Presto
          - Trident
    types:
      json:
      - application/json
      - text/json
      hal:
      - application/hal+json
      - application/hal+xml
      xml:
      - text/xml
      - application/xml
      atom: application/atom+xml
      css: text/css
      csv: text/csv
      js: text/javascript
      rss: application/rss+xml
      text: text/plain
      all: '*/*'
      form: application/x-www-form-urlencoded
      html:
      - text/html
      - application/xhtml+xml
      multipartForm: multipart/form-data
      pdf: application/pdf
  plugin:
    springsecurity:
      userLookup:
        userDomainClassName: com.example.User
        authorityJoinClassName: com.example.UserRole
      authority:
        className: com.example.Role
      controllerAnnotations:
        staticRules:
        - pattern: /
          access:
          - permitAll
        - pattern: /index
          access:
          - permitAll
        - pattern: /error
          access:
          - permitAll
        - pattern: /shutdown
          access:
          - permitAll
        - pattern: /assets/**
          access:
          - permitAll
        - pattern: /**/js/**
          access:
          - permitAll
        - pattern: /**/css/**
          access:
          - permitAll
        - pattern: /**/images/**
          access:
          - permitAll
        - pattern: /**/favicon.ico
          access:
          - permitAll
dataSource:
  driverClassName: org.postgresql.Driver
  username: postgres
  password: ''
  pooled: true
  jmxExport: true
environments:
  development:
    dataSource:
      dbCreate: create-drop
      url: jdbc:postgresql://localhost:5432/devDb?tcpKeepAlive=true
  test:
    dataSource:
      dbCreate: update
      url: jdbc:postgresql://localhost:5432/testDb?tcpKeepAlive=true
  production:
    dataSource:
      dbCreate: none
      url: jdbc:postgresql://localhost:5432/postgres?tcpKeepAlive=true
hibernate:
  cache:
    queries: false
    use_second_level_cache: false
    use_query_cache: false
